name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Verify packaging (unpacked, no installer)
        run: npx electron-builder --win --dir

      - name: Check that media shipped next to the app
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/win-unpacked/resources/media/video.mp4')) {
            throw 'resources/media/video.mp4 missing from the packaged app'
          }
          Get-ChildItem release/win-unpacked/resources/media | Select-Object Name, Length

      - name: Check that koffi's native binary is unpacked outside the asar
        shell: pwsh
        run: |
          $node = Get-ChildItem -Recurse 'release/win-unpacked/resources/app.asar.unpacked' -Filter 'koffi.node' -ErrorAction SilentlyContinue
          if (-not $node) { throw 'koffi.node 没有被解包到 app.asar.unpacked，打包版会在启动时崩溃' }
          $node | Select-Object FullName, Length

      - name: Check that the renderer bundles are inside the asar
        shell: pwsh
        run: |
          $asar = 'release/win-unpacked/resources/app.asar'
          $list = & npx asar list $asar
          foreach ($f in @('splash.bundle.js', 'panel.bundle.js', 'panel.html', 'index.html')) {
            if (-not ($list -match [regex]::Escape($f))) { throw "$f 不在 asar 里" }
          }
          'bundles ok'
