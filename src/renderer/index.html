<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: file:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Codex</title>
    <link rel="stylesheet" href="styles/splash.css" />
  </head>
  <body>
    <!-- #frame 的位置/尺寸由 portal.layoutFor() 计算，和主进程摆放真实窗口用的是同一套映射 -->
    <div id="frame">
      <img id="poster" alt="" />
      <video id="video" playsinline preload="auto" muted></video>
    </div>

    <div id="note" hidden></div>
    <button id="skip" type="button">跳过 <kbd>Esc</kbd></button>

    <script src="splash.bundle.js"></script>
  </body>
</html>
