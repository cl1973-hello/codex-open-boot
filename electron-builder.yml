appId: com.github.cl1973hello.codexopenboot
productName: Codex Open Boot
copyright: Copyright © 2026 cl1973-hello

directories:
  output: release
  buildResources: build

# 运行期需要的东西：主进程、预加载、共享纯函数、两个渲染入口、koffi 的 .node。
# 视频走 extraResources（在 asar 外面），<video> 才能正常 seek。
files:
  - package.json
  - src/main/**/*
  - src/preload/**/*
  - src/shared/**/*
  - src/renderer/index.html
  - src/renderer/panel.html
  - src/renderer/splash.bundle.js
  - src/renderer/panel.bundle.js
  - src/renderer/styles/**/*
  - '!**/*.map'

# koffi 是 NAPI 预编译包，.node 不能待在 asar 里
asarUnpack:
  - '**/node_modules/koffi/**'

extraResources:
  - from: assets/media
    to: media
    filter:
      - '**/*'
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: codex.ico

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: CodexOpenBoot-${version}-win-${arch}-portable.${ext}
  requestExecutionLevel: user

nsis:
  artifactName: CodexOpenBoot-${version}-win-${arch}-setup.${ext}
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  # 桌面/开始菜单的「Codex」入口由程序自己创建（见 src/main/entry.js），
  # 因为图标要从 Codex 包里提取，安装器不做这件事
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Codex Open Boot
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: cl1973-hello
  repo: codex-open-boot
  # Tag push publishes immediately so the README's "latest release" link works for
  # end users. Switch to `draft` if you want to eyeball the build before it goes public.
  releaseType: release
